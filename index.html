    <style>
        /* =========================================================
           V7.2.5 MAJOR UI REDESIGN 
           Theme: Warm + Modern + Clean + Family Digital Library
        ========================================================= */
        :root { 
            --primary: #2563EB; /* Deep Royal Blue */
            --primary-hover: #1D4ED8; 
            --primary-light: #EFF6FF;
            --accent: #F59E0B; /* Warm Gold for badges */
            --bg-color: #FAF9F6; /* Warm Off-White / Cream */
            --surface: #FFFFFF;
            --text-main: #1E293B; /* Slate 800 */
            --text-muted: #64748B; /* Slate 500 */
            --border: #E2E8F0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-card: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.03);
            --shadow-hover: 0 12px 20px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.05);
            
            --radius-xl: 24px;
            --radius-lg: 16px; 
            --radius-md: 12px; 
            --radius-sm: 8px;
        }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            -webkit-font-smoothing: antialiased; 
        }

        /* --- Global Layout --- */
        .main-container { max-width: 1280px; margin: 0 auto 80px auto; padding: 0 24px; }
        
        /* --- 1. Header Redesign --- */
        header { 
            background: var(--surface);
            padding: 0.75rem 2rem; 
            border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 50; 
            box-shadow: var(--shadow-sm);
            height: 60px;
        }
        .logo-container { display: flex; align-items: center; gap: 14px; }
        .logo-icon-wrapper { 
            width: 44px; height: 44px; 
            background: linear-gradient(135deg, var(--primary), #1E3A8A); 
            color: white; 
            border-radius: var(--radius-md); 
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem; 
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }
        .logo-text { display: flex; flex-direction: column; justify-content: center; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin: 0; line-height: 1.2; }
        .logo-sub { font-size: 0.8rem; color: var(--primary); margin: 0; font-weight: 500; letter-spacing: 0.5px; }
        
        .controls { display: flex; align-items: center; gap: 16px; }
        
        .status-badge { 
            font-size: 0.85rem; padding: 6px 14px; border-radius: 99px; 
            font-weight: 500; display: flex; align-items: center; gap: 8px; 
            background: var(--surface); border: 1px solid var(--border);
        }
        .status-loading { color: #D97706; background: #FEF3C7; border-color: #FDE68A; }
        .status-success { color: #059669; background: #ECFDF5; border-color: #A7F3D0; }
        .status-error { color: #DC2626; background: #FEF2F2; border-color: #FECACA; }
        
        button.btn-auth { 
            background: var(--primary); color: white; border: none; padding: 8px 20px; 
            border-radius: 99px; cursor: pointer; font-size: 0.95rem; font-weight: 500; 
            transition: all 0.2s; display: flex; align-items: center; gap: 8px; 
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); font-family: 'Kanit', sans-serif; 
        }
        button.btn-auth:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3); }
        button.btn-logout { background: #F1F5F9; color: var(--text-main); box-shadow: none; display: none; }
        button.btn-logout:hover { background: #E2E8F0; color: #DC2626; transform: none; box-shadow: none; }

        .library-hero {
            background: linear-gradient(to right, #ffffff, #F8FAFC);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 3rem 2rem;
            margin: 2rem 0;
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .library-hero::before {
            content: '📚'; position: absolute; font-size: 120px; opacity: 0.03; right: 5%; top: -20px; transform: rotate(15deg);
        }
        .library-hero::after {
            content: '✨'; position: absolute; font-size: 80px; opacity: 0.03; left: 5%; bottom: -10px; transform: rotate(-10deg);
        }
        .library-hero h1 {
            font-size: 2.25rem; font-weight: 700; color: var(--text-main); margin: 0 0 0.5rem 0; letter-spacing: -0.5px; position: relative; z-index: 1;

            display: inline-flex; background: var(--primary-light); color: var(--primary); padding: 8px 24px; border-radius: 99px; font-weight: 500; font-size: 0.95rem; position: relative; z-index: 1; border: 1px solid #DBEAFE;

            border: 2px solid var(--border);

            color: white; padding: 4px 10px; 
            border-radius: 99px; font-size: 0.75rem; display: flex; align-items: center; gap: 4px;

            display: flex; flex-direction: column; flex-grow: 1;
        }
        .book-title {

        .book-meta {
            font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; font-weight: 500;
        }

        /* --- 7. Premium Internal Fallback Covers --- */
        .premium-fallback {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; box-sizing: border-box; z-index: 0;
            border-radius: inherit;
        }
        /* Spine Simulation */
        .premium-fallback::before {
            content: ''; position: absolute; left: 0; top: 0; width: 6%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.2), rgba(0,0,0,0.15) 100%);
            border-right: 1px solid rgba(0,0,0,0.2); z-index: 2;
        }
        /* Cover Content */
        .fallback-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 16px 12px 16px 20px; text-align: center; color: rgba(255,255,255,0.9); z-index: 1;
        }
        .fallback-content i { font-size: 2.5rem; margin-bottom: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .fallback-content .f-type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 4px; }
        .fallback-content .f-title { font-size: 0.85rem; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        /* Theming for different fallbacks */
        .bg-pdf { background: linear-gradient(135deg, #1E3A8A, #312E81); }
        .bg-series { background: linear-gradient(135deg, #0F172A, #334155); }
        .bg-empty { background: linear-gradient(135deg, #64748B, #94A3B8); color: #FFFFFF; }
        .bg-folder { background: linear-gradient(135deg, #F1F5F9, #E2E8F0); }
        .bg-folder .fallback-content { color: #64748B; padding: 16px; }
        .bg-folder .fallback-content i { color: #94A3B8; filter: none; font-size: 3rem; }
        .bg-folder::before { display: none; /* No spine for folders */ }

        /* --- 11. Skeleton / Loading State --- */
        .skeleton-book { display: flex; flex-direction: column; gap: 12px; animation: pulse 1.5s infinite ease-in-out; }
        .sk-cover { width: 100%; aspect-ratio: 3/4; background: #E2E8F0; border-radius: var(--radius-md); }
        .sk-text { height: 14px; background: #E2E8F0; border-radius: 4px; width: 90%; }
        .sk-text.short { width: 60%; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* --- 12. & 13. Empty & Error States --- */
        .state-container { 
            grid-column: 1 / -1; text-align: center; padding: 80px 20px; 
            background: var(--surface); border-radius: var(--radius-xl); 
            border: 1px dashed #CBD5E1; box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .state-icon { font-size: 4rem; margin-bottom: 20px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .state-title { font-size: 1.25rem; color: var(--text-main); font-weight: 600; margin-bottom: 8px; }
        .state-desc { font-size: 1rem; color: var(--text-muted); max-width: 400px; line-height: 1.5; }
        .state-error { border-color: #FECACA; background: #FEF2F2; }

        async function initializeGapiClient() {
            try {
                await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
                gapiInited = true; maybeStartApp();
            } catch (err) {
                console.error('❌ GAPI init failed:', err);
                if (domReady) updateStatus('เชื่อมต่อ Google API ไม่สำเร็จ', 'error');
            }
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES,
                callback: (res) => {
                    if (!res || !res.access_token) return updateStatus('เข้าสู่ระบบไม่สำเร็จ', 'error');
                    localStorage.setItem('gdrive_token', res.access_token);
                    localStorage.setItem('gdrive_token_expire', Date.now() + (res.expires_in * 1000));
                    gapi.client.setToken({ access_token: res.access_token });
                    updateStatus('เชื่อมต่อแล้ว', 'success');
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'flex';
                    gapiInited && gapi.client?.drive ? loadDriveContent(ROOT_FOLDER_ID) : waitForDriveAPI().then(() => loadDriveContent(ROOT_FOLDER_ID));
                }
            });
            gisInited = true; maybeStartApp();
        }

        function maybeStartApp() { if (gapiInited && gisInited && domReady && !appStarted) { appStarted = true; checkExistingToken(); } }

        function checkExistingToken() {
            const token = localStorage.getItem('gdrive_token'), expire = localStorage.getItem('gdrive_token_expire');
            if (token && expire && Date.now() < parseInt(expire)) {
                gapi.client.setToken({ access_token: token });
                updateStatus('เชื่อมต่อแล้ว', 'success');
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'flex';
                gapiInited && gapi.client?.drive ? loadDriveContent(ROOT_FOLDER_ID) : waitForDriveAPI().then(() => loadDriveContent(ROOT_FOLDER_ID));
            } else {
                localStorage.removeItem('gdrive_token'); localStorage.removeItem('gdrive_token_expire');
                updateStatus('กรุณาเข้าสู่ระบบ', 'loading');
            }
        }

        function handleAuthClick() { tokenClient.requestAccessToken({ prompt: 'select_account' }); }

        function handleSignoutClick() {
            driveLoadRequestId++; readerLoadId++;
            const tokenObj = gapi.client.getToken();
            if (tokenObj?.access_token) google.accounts.oauth2.revoke(tokenObj.access_token);
            gapi.client.setToken('');
            localStorage.removeItem('gdrive_token'); localStorage.removeItem('gdrive_token_expire');
            folderCoverCache.clear();
            document.getElementById('content-area').innerHTML = '';
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('breadcrumb').innerHTML = '';
            updateHeroStats('ออกจากระบบแล้ว');
            currentFolderItems = []; currentViewMode = 'grid'; activeSeriesData = null; currentFolderId = ROOT_FOLDER_ID;
            appStarted = false; updateStatus('ตัดการเชื่อมต่อ', 'error');
        }

        function updateStatus(msg, type) {
            const badge = document.getElementById('status-badge');
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-cloud-download-alt';
            let iconClass = type === 'loading' ? 'fa-spin' : '';
            badge.innerHTML = `<i class="fas ${icon} ${iconClass}"></i> <span>${msg}</span>`;
            badge.className = `status-badge status-${type}`;
            badge.title = msg;
        }

        function waitForDriveAPI(timeout = 10000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (gapiInited && gapi?.client?.drive) return resolve();
                    if (Date.now() - start >= timeout) return reject(new Error('Drive API timeout'));
                    setTimeout(check, 100);
                };
                check();
            });
        }

        function updateHeroStats(msg) {
            const stats = document.getElementById('hero-stats');
            if(stats) stats.innerHTML = msg;
        }

        // --- Drive Content Loader & Pagination ---
        async function loadDriveContent(folderId, folderName = 'หน้าหลัก') {
            const requestId = ++driveLoadRequestId;
            currentViewMode = 'grid'; activeSeriesData = null; currentFolderId = folderId;

            if (!gapi?.client?.drive) {
                updateStatus('กำลังเตรียมข้อมูล...', 'loading');
                try { await waitForDriveAPI(); } catch (e) {
                    if (requestId !== driveLoadRequestId) return;
                    updateStatus('ข้อผิดพลาด', 'error');
                    renderErrorState('ไม่สามารถโหลดข้อมูลได้', 'กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตหรือลองใหม่อีกครั้ง');
                    return;
                }
            }
            if (requestId !== driveLoadRequestId) return;

            renderSkeletonGrid();
            document.getElementById('searchInput').value = '';
            updateHeroStats('<i class="fas fa-spinner fa-spin"></i> กำลังโหลด...');

            try {
                const mimeFilter = `(mimeType = 'application/vnd.google-apps.folder' or mimeType = 'application/pdf' or mimeType = 'image/jpeg' or mimeType = 'image/png' or mimeType = 'image/webp' or mimeType = 'image/gif')`;
                const qStr = `'${folderId}' in parents and trashed = false and ${mimeFilter}`;
                let allFiles = [], pageToken = null;

                do {
                    if (requestId !== driveLoadRequestId) return;
                    const res = await gapi.client.drive.files.list({ q: qStr, fields: 'nextPageToken, files(id, name, mimeType, thumbnailLink, modifiedTime)', pageSize: 1000, orderBy: 'folder, name', pageToken });
                    if (requestId !== driveLoadRequestId) return;
                    (res.result.files || []).forEach(f => allFiles.push({
                        id: f.id || '', name: f.name || 'ไม่มีชื่อ', mimeType: f.mimeType || '', thumbnailLink: f.thumbnailLink || null, modifiedTime: f.modifiedTime || new Date().toISOString()
                    }));
                    pageToken = res.result.nextPageToken;
                } while (pageToken);

                if (requestId !== driveLoadRequestId) return;

                folderHistory = folderId === ROOT_FOLDER_ID ? [{ id: ROOT_FOLDER_ID, name: 'หน้าหลัก' }] : (folderHistory.find(f => f.id === folderId) ? folderHistory.slice(0, folderHistory.findIndex(f => f.id === folderId) + 1) : [...folderHistory, { id: folderId, name: folderName }]);
                renderBreadcrumb();

                currentFolderItems = allFiles;
                if(currentFolderItems.length > 0) {
                    applySearchAndSort();
                } else {
                    updateHeroStats('แฟ้มว่างเปล่า');
                    renderEmptyState('📂', 'ยังไม่มีหนังสือในแฟ้มนี้', 'ลองเลือกแฟ้มอื่นเพื่ออ่านการ์ตูนเรื่องโปรดของคุณ');
                }
            } catch (err) {
                if (requestId !== driveLoadRequestId) return;
                console.error(err);
                if (err.status === 401 || err?.result?.error?.code === 401) handleSignoutClick();
                else renderErrorState('เกิดข้อผิดพลาดในการโหลด', 'ไม่สามารถเชื่อมต่อกับ Google Drive ได้');
            }
        }

        // --- Filename Parser & Grouping ---
        const normalizeSeriesKey = (name) => String(name || '').normalize('NFC').toLowerCase().replace(/[\s\-_]+/g, '').trim();

        function parseVolumeName(fileName) {
            const lastDot = fileName.lastIndexOf('.');
            if (lastDot === -1) return null;
            const nameExt = fileName.substring(0, lastDot), ext = fileName.substring(lastDot + 1).toLowerCase();
            
            const rangeMatch = nameExt.match(/^(.+?)(?:\s+เล่ม\s*|\s*[_-]\s*|\s+)(\d+)\s*-\s*(\d+)$/i);
            if (rangeMatch) return { type: 'collection', seriesName: rangeMatch[1].replace(/[-_\s]+$/, '').trim(), volumeStart: parseInt(rangeMatch[2], 10), volumeEnd: parseInt(rangeMatch[3], 10), extension: ext };

            for (const pat of [/^(.+?)\s+เล่ม\s*(\d+)$/i, /^(.+?)_(\d+)$/, /^(.+?)-(\d+)$/, /^(.+?)\s+(\d+)$/]) {
                const m = nameExt.match(pat);
                if (m && m[1].replace(/[-_\s]+$/, '').trim()) {
                    return { type: 'single', seriesName: m[1].replace(/[-_\s]+$/, '').trim(), volumeNumber: parseInt(m[2], 10), extension: ext };
                }
            }
            return null;
        }

        const isCoverImage = (name) => ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(name.split('.').pop().toLowerCase());

        function groupFilesAndFolders(items) {
            let folders = [], individualFiles = [], coverFiles = [], parsedItems = [];
            items.forEach(item => {
                if (item.mimeType === 'application/vnd.google-apps.folder') folders.push(item);
                else if (isCoverImage(item.name)) coverFiles.push(item);
                else {
                    const parsed = parseVolumeName(item.name);
                    parsed ? parsedItems.push({ item, parsed }) : individualFiles.push(item);
                }
            });

            const rangeKeys = new Set(parsedItems.filter(p => p.parsed.type === 'collection').map(p => normalizeSeriesKey(p.parsed.seriesName)));
            let seriesMap = {};

            parsedItems.forEach(({ item, parsed }) => {
                if (parsed.type === 'collection') {
                    seriesMap[`${parsed.seriesName} (เล่ม ${parsed.volumeStart}-${parsed.volumeEnd})_${item.id}`] = {
                        type: 'collection', seriesName: parsed.seriesName, volumeRange: `เล่ม ${parsed.volumeStart}–${parsed.volumeEnd}`, books: [item], modifiedTime: item.modifiedTime
                    };
                } else if (parsed.type === 'single') {
                    const key = normalizeSeriesKey(parsed.seriesName);
                    if (rangeKeys.has(key)) individualFiles.push({ ...item, isSingleWithRange: true, seriesName: parsed.seriesName, volumeNumber: parsed.volumeNumber });
                    else {
                        if (!seriesMap[key]) seriesMap[key] = { type: 'series', seriesName: parsed.seriesName, books: [], modifiedTime: item.modifiedTime };
                        seriesMap[key].books.push({ ...item, volumeNumber: parsed.volumeNumber });
                        if (new Date(item.modifiedTime) > new Date(seriesMap[key].modifiedTime)) seriesMap[key].modifiedTime = item.modifiedTime;
                    }
                }
            });

            Object.values(seriesMap).forEach(s => { if (s.type === 'series') s.books.sort((a, b) => a.volumeNumber - b.volumeNumber); });
            return { folders, seriesList: Object.values(seriesMap), individualFiles, coverFiles };
        }

        const findSeriesCover = (seriesName, coverFiles) => {
            const target = normalizeSeriesKey(seriesName);
            const cover = coverFiles.find(c => normalizeSeriesKey(c.name.substring(0, c.name.lastIndexOf('.'))) === target);
            return cover?.thumbnailLink ? cover.thumbnailLink.split('=')[0] + '=s800' : null;
        };

        // --- Search, Sort ---
        function applySearchAndSort() {
            if (currentViewMode === 'series-detail' && activeSeriesData) return renderSeriesDetailUI(activeSeriesData);
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortType = document.getElementById('sortSelect').value;
            const { folders, seriesList, individualFiles, coverFiles } = groupFilesAndFolders(currentFolderItems);

            const fFolders = folders.filter(f => f.name.toLowerCase().includes(query));
            const fSeries = seriesList.filter(s => s.seriesName.toLowerCase().includes(query) || (s.volumeRange && s.volumeRange.toLowerCase().includes(query)));
            const fFiles = individualFiles.filter(f => (f.isSingleWithRange ? `${f.seriesName} เล่ม ${f.volumeNumber}` : f.name).toLowerCase().includes(query));

            const sortFn = (a, b) => {
                const nA = a.name || a.seriesName, nB = b.name || b.seriesName;
                if (sortType === 'name-asc') return nA.localeCompare(nB, 'th');
                if (sortType === 'name-desc') return nB.localeCompare(nA, 'th');
                if (sortType === 'latest') return new Date(b.modifiedTime || 0) - new Date(a.modifiedTime || 0);
                return 0;
            };

            if (sortType !== 'default') { fFolders.sort(sortFn); fSeries.sort(sortFn); fFiles.sort(sortFn); }
            else { fFolders.sort((a, b) => a.name.localeCompare(b.name, 'th')); fSeries.sort((a, b) => a.seriesName.localeCompare(b.seriesName, 'th')); fFiles.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th')); }

            renderMainGridUI(fFolders, fSeries, fFiles, coverFiles, query !== '');
        }

        window.addEventListener('DOMContentLoaded', () => {
            domReady = true;
            document.getElementById('searchInput').addEventListener('input', applySearchAndSort);
            document.getElementById('sortSelect').addEventListener('change', applySearchAndSort);
            document.addEventListener('keydown', e => {
                if (document.getElementById('reader-modal').style.display === 'flex') {
                    if (e.key === 'ArrowLeft') onPrevPage();
                    if (e.key === 'ArrowRight') onNextPage();
                }
            });
            maybeStartApp();
        });

        // =========================================================
        // 🎨 V7.2.5 UI RENDERING LOGIC (DOM & CSS Changes Only)
        // =========================================================

        function generatePremiumFallback(type, title) {
            let bgClass = 'bg-empty', icon = 'fa-image', typeText = 'ไม่มีปก';
            if (type === 'pdf') { bgClass = 'bg-pdf'; icon = 'fa-file-pdf'; typeText = 'PDF BOOK'; }
            else if (type === 'series') { bgClass = 'bg-series'; icon = 'fa-layer-group'; typeText = 'SERIES'; }
            else if (type === 'folder') { bgClass = 'bg-folder'; icon = 'fa-folder'; typeText = 'COLLECTION'; }

            return `
                <div class="premium-fallback ${bgClass}">
                    <div class="fallback-content">
                        <i class="fas ${icon}"></i>
                        <div class="f-type">${typeText}</div>
                        ${title ? `<div class="f-title">${escapeHtml(title)}</div>` : ''}
                    </div>
                </div>
            `;
        }

        async function renderMainGridUI(folders, seriesList, files, coverFiles, isSearching = false) {
            const area = document.getElementById('content-area');
            area.innerHTML = '';
            
            // UI Hero Stats Update
            if (isSearching) {
                updateHeroStats(`ผลการค้นหา ${folders.length + seriesList.length + files.length} รายการ`);
            } else {
                let statsArr = [];
                if(folders.length > 0) statsArr.push(`${folders.length} แฟ้ม`);
                if(seriesList.length > 0) statsArr.push(`${seriesList.length} ซีรีส์`);
                if(files.length > 0) statsArr.push(`${files.length} เล่ม`);
                updateHeroStats(statsArr.length > 0 ? statsArr.join(' · ') : 'หน้าหลัก');
            }

            if (!folders.length && !seriesList.length && !files.length) {
                renderEmptyState(isSearching ? '🔎' : '📚', isSearching ? 'ไม่พบรายการที่ค้นหา' : 'ไม่พบหนังสือที่รองรับ', isSearching ? 'ลองเปลี่ยนคำค้นหาใหม่อีกครั้ง' : 'ลองตรวจสอบไฟล์ใน Google Drive ของคุณ');
                return;
            }

            // Render Folders (Collection Design)
            for (const f of folders) {
                const card = document.createElement('div');
                card.className = 'book-card folder-card';
                card.innerHTML = `
                    <div class="book-card-cover">
                        ${generatePremiumFallback('folder', f.name)}
                        <div class="badge-overlay badge-folder"><i class="fas fa-folder-open"></i> แฟ้ม</div>
                    </div>
                    <div class="book-card-info">
                        <div class="book-title" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
                        <div class="book-meta">Collection</div>
                    </div>`;
                card.onclick = () => loadDriveContent(f.id, f.name);
                getFolderCover(f.id, f.name).then(url => { 
                    if (url) {
                        const coverDiv = card.querySelector('.book-card-cover');
                        coverDiv.innerHTML = `${generatePremiumFallback('folder', f.name)}<img src="${url}" alt="Cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"><div class="badge-overlay badge-folder"><i class="fas fa-folder-open"></i> แฟ้ม</div>`;
                    }
                });
                area.appendChild(card);
            }

            // Render Series (Book Cover Design)
            for (const s of seriesList) {
                const card = document.createElement('div');
                card.className = 'book-card';
                
                let coverUrl = findSeriesCover(s.seriesName, coverFiles) || (s.books[0]?.thumbnailLink ? s.books[0].thumbnailLink.split('=')[0] + '=s800' : null);
                let fallbackType = (s.type === 'collection' || s.books[0]?.mimeType?.includes('pdf')) ? 'pdf' : 'series';
                
                let imgHTML = generatePremiumFallback(fallbackType, s.seriesName);
                if (coverUrl) imgHTML += `<img src="${coverUrl}" alt="Cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;

                card.innerHTML = `
                    <div class="book-card-cover">
                        ${imgHTML}
                        <div class="badge-overlay badge-series"><i class="fas ${s.type === 'collection' ? 'fa-file-pdf' : 'fa-layer-group'}"></i> ${s.type === 'collection' ? s.volumeRange : `${s.books.length} เล่ม`}</div>
                    </div>
                    <div class="book-card-info">
                        <div class="book-title" title="${escapeHtml(s.seriesName)}">${escapeHtml(s.seriesName)}</div>
                    </div>`;
                card.onclick = () => s.type === 'collection' ? openReader(s.books[0].id, s.books[0].name, s.books[0].mimeType) : openSeriesDetail(s);
                area.appendChild(card);
            }

            // Render Single Files (Book Cover Design)
            for (const item of files) {
                const card = document.createElement('div');
                card.className = 'book-card';
                const page = getBookmark(item.id);
                const titleStr = item.isSingleWithRange ? `${escapeHtml(item.seriesName)} เล่ม ${escapeHtml(String(item.volumeNumber))}` : escapeHtml(item.name);
                
                const coverUrl = item.thumbnailLink ? item.thumbnailLink.split('=')[0] + '=s800' : null;
                let fallbackType = item.mimeType.includes('pdf') ? 'pdf' : 'empty';
                
                let imgHTML = generatePremiumFallback(fallbackType, titleStr);
                if (coverUrl) imgHTML += `<img src="${coverUrl}" alt="Cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;

                const badge = item.isSingleWithRange ? `<div class="badge-overlay badge-single">เล่ม ${item.volumeNumber}</div>` : (page > 1 ? `<div class="badge-overlay badge-bookmark"><i class="fas fa-bookmark"></i> หน้า ${page}</div>` : '');

                card.innerHTML = `
                    <div class="book-card-cover">
                        ${imgHTML}
                        ${badge}
                    </div>
                    <div class="book-card-info">
                        <div class="book-title" title="${titleStr}">${titleStr}</div>
                    </div>`;
                card.onclick = () => openReader(item.id, item.name, item.mimeType);
                area.appendChild(card);
            }
        }

        function openSeriesDetail(series) {
            currentViewMode = 'series-detail'; activeSeriesData = series;
            document.getElementById('searchInput').value = '';
            renderSeriesBreadcrumb(series.seriesName);
            renderSeriesDetailUI(series);
        }

        function renderSeriesBreadcrumb(seriesName) {
            const bc = document.getElementById('breadcrumb');
            if (!bc) return;
            bc.innerHTML = '';
            
            folderHistory.forEach((folder, index) => {
                const span = document.createElement('span');
                span.className = 'bc-item';
                span.innerHTML = index === 0 ? '<i class="fas fa-home"></i> หน้าหลัก' : `${escapeHtml(folder.name)}`;
                span.onclick = () => loadDriveContent(folder.id, folder.name);
                bc.appendChild(span);

                const sep = document.createElement('span');
                sep.className = 'bc-separator';
                sep.innerHTML = '<i class="fas fa-chevron-right"></i>';
                bc.appendChild(sep);
            });

            const seriesSpan = document.createElement('span');
            seriesSpan.className = 'bc-item current';
            seriesSpan.textContent = seriesName;
            bc.appendChild(seriesSpan);
            
            // Mobile scroll to end
            requestAnimationFrame(() => { bc.scrollLeft = bc.scrollWidth; });
        }

        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            if (!bc) return;
            bc.innerHTML = '';
            
            folderHistory.forEach((folder, index) => {
                const span = document.createElement('span');
                span.className = index === folderHistory.length - 1 ? 'bc-item current' : 'bc-item';
                span.innerHTML = index === 0 ? '<i class="fas fa-home"></i> หน้าหลัก' : `${escapeHtml(folder.name)}`;
                span.onclick = index === folderHistory.length - 1 ? null : () => loadDriveContent(folder.id, folder.name);
                bc.appendChild(span);

                if (index < folderHistory.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'bc-separator';
                    sep.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    bc.appendChild(sep);
                }
            });
            
            // Mobile scroll to end
            requestAnimationFrame(() => { bc.scrollLeft = bc.scrollWidth; });
        }

        function renderSeriesDetailUI(series) {
            const area = document.getElementById('content-area');
            if (!area) return;
            area.innerHTML = '';
            const query = document.getElementById('searchInput').value.toLowerCase();
            const books = query ? series.books.filter(b => b.name.toLowerCase().includes(query)) : series.books;
            
            updateHeroStats(`ซีรีส์: ${escapeHtml(series.seriesName)} · ${books.length} เล่ม`);

            if (!books.length) { 
                renderEmptyState('🔎', 'ไม่พบเล่มที่ค้นหาในซีรีส์นี้', 'ลองตรวจสอบคำค้นหาอีกครั้ง');
                return; 
            }
            
            const { coverFiles } = groupFilesAndFolders(currentFolderItems);
            const fallbackCoverUrl = findSeriesCover(series.seriesName, coverFiles);

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                const page = getBookmark(book.id);
                const titleStr = `เล่ม ${escapeHtml(String(book.volumeNumber))}`;
                
                const coverUrl = book.thumbnailLink ? book.thumbnailLink.split('=')[0] + '=s800' : fallbackCoverUrl;
                let fallbackType = book.mimeType?.includes('pdf') ? 'pdf' : 'empty';

                let imgHTML = generatePremiumFallback(fallbackType, titleStr);
                if (coverUrl) imgHTML += `<img src="${coverUrl}" alt="Cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;

                card.innerHTML = `
                    <div class="book-card-cover">
                        ${imgHTML}
                        ${page > 1 ? `<div class="badge-overlay badge-bookmark"><i class="fas fa-bookmark"></i> หน้า ${page}</div>` : ''}
                    </div>
                    <div class="book-card-info">
                        <div class="book-title" title="${titleStr}">${titleStr}</div>
                    </div>`;
                card.onclick = () => openReader(book.id, book.name, book.mimeType);
                area.appendChild(card);
            });
        }

        // --- Utility UI Renderers ---
        function renderSkeletonGrid() {
            const area = document.getElementById('content-area');
            area.innerHTML = '';
            for(let i=0; i<6; i++){
                area.innerHTML += `
                    <div class="skeleton-book">
                        <div class="sk-cover"></div>
                        <div class="sk-text"></div>
                        <div class="sk-text short"></div>
                    </div>`;
            }
        }
        
        function renderEmptyState(icon, title, desc) {
            document.getElementById('content-area').innerHTML = `
                <div class="state-container">
                    <div class="state-icon">${icon}</div>
                    <div class="state-title">${title}</div>

                </div>`;

            document.getElementById('content-area').innerHTML = `

                    <div class="state-title">${title}</div>
                    <div class="state-desc">${desc}</div>

        // --- FREEZE ZONE: Folder Cover Cache & Finder ---
        async function getFolderCover(folderId, folderName = '') {
            if (folderCoverCache.has(folderId)) return folderCoverCache.get(folderId);
            try {
                if (!gapi?.client?.drive) return null;
                const mimeQ = `(mimeType = 'application/pdf' or mimeType = 'image/jpeg' or mimeType = 'image/png' or mimeType = 'image/webp' or mimeType = 'image/gif')`;
                const res = await gapi.client.drive.files.list({ q: `'${folderId}' in parents and trashed = false and ${mimeQ}`, fields: 'files(id, name, mimeType, thumbnailLink)', pageSize: 100 });
                let files = res.result.files || [];
                if (!files.length) { folderCoverCache.set(folderId, null); return null; }

                files.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
                const cleanKey = normalizeSeriesKey(folderName);

                const matchImg = files.find(f => f.mimeType !== 'application/pdf' && normalizeSeriesKey(f.name.substring(0, f.name.lastIndexOf('.'))) === cleanKey);
                if (matchImg?.thumbnailLink) { const url = matchImg.thumbnailLink.split('=')[0] + '=s800'; folderCoverCache.set(folderId, url); return url; }

                const matchPdf = files.find(f => f.mimeType === 'application/pdf' && normalizeSeriesKey(f.name.substring(0, f.name.lastIndexOf('.'))) === cleanKey);
                if (matchPdf?.thumbnailLink) { const url = matchPdf.thumbnailLink.split('=')[0] + '=s800'; folderCoverCache.set(folderId, url); return url; }

                const firstImg = files.find(f => f.mimeType !== 'application/pdf');
                if (firstImg?.thumbnailLink) { const url = firstImg.thumbnailLink.split('=')[0] + '=s800'; folderCoverCache.set(folderId, url); return url; }

                const firstPdf = files.find(f => f.mimeType === 'application/pdf');
                if (firstPdf?.thumbnailLink) { const url = firstPdf.thumbnailLink.split('=')[0] + '=s800'; folderCoverCache.set(folderId, url); return url; }

                folderCoverCache.set(folderId, null);
                return null;
            } catch (e) {
                folderCoverCache.set(folderId, null);
                return null;
            }
        }

        // --- FREEZE ZONE: Bookmark & Reader Management ---
        const saveBookmark = (id, page) => localStorage.setItem(`familyComic:lastPage:${id}`, page);
        const getBookmark = (id) => parseInt(localStorage.getItem(`familyComic:lastPage:${id}`)) || 1;
        
        function showToast(msg) {
            const t = document.getElementById('toast-message');
            if (!t) return;
            t.innerHTML = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3500);
        }

        function openReader(fileId, fileName, mimeType) {
            currentFileId = fileId;
            document.getElementById('reader-title').innerText = fileName;
            document.getElementById('reader-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            requestAnimationFrame(updateMobileNavPosition);

            const isPdf = !!(mimeType && mimeType.includes('pdf'));
            document.getElementById('pdf-canvas').style.display = isPdf ? 'block' : 'none';
            document.getElementById('pdf-toolbar').style.display = isPdf ? 'flex' : 'none';
            document.getElementById('tap-zone-left').style.display = isPdf ? 'block' : 'none';
            document.getElementById('tap-zone-right').style.display = isPdf ? 'block' : 'none';
            const frame = document.getElementById('reader-frame');
            frame.style.display = isPdf ? 'none' : 'block';
            if (!isPdf) { readerLoadId++; frame.src = `https://drive.google.com/file/d/${currentFileId}/preview`; }
            else loadPDF();
        }

        async function loadPDF() {
            const loadId = ++readerLoadId;
            const loadingUI = document.getElementById('pdf-loading');
            if (!loadingUI) return;
            loadingUI.style.display = 'block';
            loadingUI.innerHTML = '<i class="fas fa-spinner fa-spin"></i> เตรียมการดาวน์โหลดไฟล์...';
            
            canvas = document.getElementById('pdf-canvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            pdfDoc = null; pageRendering = false; pageNumPending = null;
            
            const saved = getBookmark(currentFileId);
            const tokenObj = gapi.client.getToken();
            if (!tokenObj?.access_token) {
                if (loadId !== readerLoadId) return;
                loadingUI.innerHTML = '❌ เซสชันหมดอายุ กรุณาโหลดหน้าเว็บและล็อกอินใหม่';
                return;
            }

            try {
                // Large PDF Strategy - DO NOT CHANGE (disableRange: false, disableStream: false)
                const task = pdfjsLib.getDocument({ url: `https://www.googleapis.com/drive/v3/files/${currentFileId}?alt=media`, httpHeaders: { 'Authorization': `Bearer ${tokenObj.access_token}` }, disableRange: false, disableStream: false });
                
                task.onProgress = p => {
                    if (loadId !== readerLoadId) return;
                    loadingUI.innerHTML = p.total > 0 ? `<i class="fas fa-spinner fa-spin"></i> กำลังโหลดหนังสือ... <b>${Math.round((p.loaded / p.total) * 100)}%</b>` : `<i class="fas fa-spinner fa-spin"></i> โหลดแล้ว... <b>${(p.loaded / (1024 * 1024)).toFixed(1)} MB</b>`;
                };

                pdfDoc = await task.promise;
                if (loadId !== readerLoadId) return;
                document.getElementById('page_count').textContent = pdfDoc.numPages;
                loadingUI.style.display = 'none';
                pageNum = Math.min(saved, pdfDoc.numPages);
                if (pageNum > 1) showToast(`📌 กำลังอ่านต่อจากหน้า ${pageNum}`);
                renderPage(pageNum, loadId);
            } catch (e) {
                if (loadId !== readerLoadId) return;
                console.error(e);
                loadingUI.innerHTML = '❌ เกิดข้อผิดพลาดในการโหลดไฟล์ <br><button onclick="closeReader()" style="margin-top:15px; background:var(--primary); padding:8px 20px; font-weight:bold; border-radius:5px; border:none; cursor:pointer; color:white;">ปิดหน้าต่าง</button>';
            }
        }

        const resetReaderViewport = () => {
            const c = document.querySelector('.reader-content');
            if (!c) return;
            c.scrollTop = 0; c.scrollLeft = 0;
            requestAnimationFrame(() => { if (c) { c.scrollTop = 0; c.scrollLeft = 0; } });
        };

        function renderPage(num, loadId = readerLoadId) {
            if (loadId !== readerLoadId) return;
            pageRendering = true;

            pdfDoc.getPage(num).then(page => {
                if (loadId !== readerLoadId) { pageRendering = false; return; }
                const c = document.querySelector('.reader-content');
                if (!c) { pageRendering = false; return; }

                const base = page.getViewport({ scale: 1 });
                const fitScale = Math.max(0.5, Math.min((c.clientWidth - 8) / base.width, 3));
                const vp = page.getViewport({ scale: fitScale });

                canvas.width = Math.floor(vp.width);
                canvas.height = Math.floor(vp.height);
                canvas.style.width = `${Math.floor(vp.width)}px`;
                canvas.style.height = `${Math.floor(vp.height)}px`;

                page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => {
                    if (loadId !== readerLoadId) { pageRendering = false; return; }
                    pageRendering = false;
                    if (pageNumPending !== null) { const p = pageNumPending; pageNumPending = null; renderPage(p, loadId); }
                    else resetReaderViewport();
                }).catch(err => { pageRendering = false; console.error(err); });
            }).catch(err => { pageRendering = false; console.error(err); });

            document.getElementById('page_num').textContent = num;
            document.getElementById('btn-prev').disabled = num <= 1;
            document.getElementById('btn-next').disabled = num >= pdfDoc.numPages;
            const mPrev = document.getElementById('mobile-btn-prev'), mNext = document.getElementById('mobile-btn-next');
            if (mPrev) mPrev.disabled = num <= 1;
            if (mNext) mNext.disabled = num >= pdfDoc.numPages;
            saveBookmark(currentFileId, num);
        }

        const queueRenderPage = (num) => pageRendering ? (pageNumPending = num) : renderPage(num);
        const onPrevPage = () => { if (pdfDoc && pageNum > 1) { resetReaderViewport(); pageNum--; queueRenderPage(pageNum); } };
        const onNextPage = () => { if (pdfDoc && pageNum < pdfDoc.numPages) { resetReaderViewport(); pageNum++; queueRenderPage(pageNum); } };

        let mobileOverlayFrame = null;
        function updateMobileNavPosition() {
            if (window.innerWidth > 768) return;
            const overlay = document.querySelector('.mobile-nav-overlay'), modal = document.getElementById('reader-modal');
            if (!overlay || !modal || modal.style.display !== 'flex' || !window.visualViewport) return;
            const vv = window.visualViewport;
            overlay.style.left = `${Math.max(0, vv.offsetLeft)}px`;
            overlay.style.top = `${vv.offsetTop + (vv.height / 2)}px`;
            overlay.style.width = `${Math.max(1, vv.width)}px`;
            overlay.style.transform = 'translateY(-50%)';
        }

        const scheduleMobileNavPosition = () => {
            if (mobileOverlayFrame !== null) return;
            mobileOverlayFrame = requestAnimationFrame(() => { mobileOverlayFrame = null; updateMobileNavPosition(); });
        };

        window.addEventListener('resize', () => { if (document.getElementById('reader-modal').style.display === 'flex') scheduleMobileNavPosition(); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleMobileNavPosition);
            window.visualViewport.addEventListener('scroll', scheduleMobileNavPosition);
        }

        function closeReader() {
            readerLoadId++;
            const modal = document.getElementById('reader-modal');
            modal.style.display = 'none';
            document.getElementById('reader-frame').src = '';
            document.body.style.overflow = 'auto';
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (document.fullscreenElement) document.exitFullscreen();
            currentFileId = null; pageRendering = false; pageNumPending = null; pdfDoc = null;
            if (currentFolderItems.length > 0) applySearchAndSort();
        }

        function toggleFullScreen() {
            const modal = document.getElementById('reader-modal');
            if (!document.fullscreenElement) modal?.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }
    </script>
</head>
<body>
    <!-- V7.2.5 Modern Header -->
    <header>
        <div class="logo-container">
            <div class="logo-icon-wrapper"><i class="fas fa-book-open"></i></div>
            <div class="logo-text">
                <h1 class="logo">บ้านการ์ตูนของเรา</h1>
                <p class="logo-sub">FAMILY LIBRARY V7.2.5</p>
            </div>
        </div>
        <div class="controls">
            <div id="status-badge" class="status-badge status-loading" title="กำลังเตรียมข้อมูล..."><i class="fas fa-spinner fa-spin"></i> <span>กำลังเตรียมข้อมูล...</span></div>
            <button id="loginBtn" class="btn-auth" onclick="handleAuthClick()"><i class="fab fa-google"></i> เข้าสู่ระบบ</button>
            <button id="logoutBtn" class="btn-auth btn-logout" onclick="handleSignoutClick()" title="ออกจากระบบ"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- V7.2.5 Library Hero -->
        <div class="library-hero">
            <h1>📚 ห้องสมุดของครอบครัว</h1>
            <p>รวมการ์ตูน หนังสือ และเรื่องโปรดของเราไว้ในที่เดียว</p>
            <div class="hero-stats" id="hero-stats">
                <i class="fas fa-spinner fa-spin" style="margin-right: 6px;"></i> กำลังโหลด...
            </div>
        </div>

        <div class="library-nav">
            <div id="breadcrumb"></div>
        </div>

        <div class="library-toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาหนังสือ, แฟ้ม, หรือซีรีส์...">
            </div>
            <div class="sort-box">
                <span class="sort-label">เรียงตาม:</span>
                <select id="sortSelect">
                    <option value="default">จัดตามชื่อ (ก-ฮ)</option>
                    <option value="latest">เพิ่มล่าสุด (ใหม่ไปเก่า)</option>
                    <option value="name-asc">ชื่อ (A-Z)</option>
                    <option value="name-desc">ชื่อ (Z-A)</option>
                </select>
            </div>
        </div>
        
        <div id="content-area" class="bookshelf-grid">
            <!-- Skeleton is rendered via JS renderSkeletonGrid() on load -->
        </div>
    </div>

    <!-- FROZEN ZONE: PDF Reader Modal (UNTOUCHED) -->
    <div id="reader-modal" class="reader-modal">
        <div id="toast-message"></div>
        <div class="reader-header">
            <button class="btn-reader btn-back" onclick="closeReader()"><i class="fas fa-arrow-left"></i> <span class="btn-text">ปิดหนังสือ</span></button>
            <span id="reader-title" class="reader-title">กำลังโหลด...</span>
            <button class="btn-reader" onclick="toggleFullScreen()" title="เต็มจอ"><i class="fas fa-expand"></i> <span class="btn-text">เต็มจอ</span></button>
        </div>
        <div class="reader-content">
            <div id="pdf-loading"></div>
            <div id="tap-zone-left" class="tap-zone left" onclick="onPrevPage()" style="display: none;"></div>
            <div id="tap-zone-right" class="tap-zone right" onclick="onNextPage()" style="display: none;"></div>
            <canvas id="pdf-canvas"></canvas>
            <iframe id="reader-frame" class="reader-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="mobile-nav-overlay">
            <button id="mobile-btn-prev" class="mobile-nav-btn" onclick="onPrevPage()"><i class="fas fa-chevron-left"></i></button>
            <button id="mobile-btn-next" class="mobile-nav-btn" onclick="onNextPage()"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div id="pdf-toolbar" class="pdf-toolbar" style="display: none;">
            <button id="btn-prev" onclick="onPrevPage()"><i class="fas fa-chevron-left"></i> <span class="btn-text">ย้อนกลับ</span></button>
            <span class="page-info">หน้า <span id="page_num"></span> / <span id="page_count"></span></span>
            <button id="btn-next" onclick="onNextPage()"><span class="btn-text">ถัดไป</span> <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</body>
</html>
