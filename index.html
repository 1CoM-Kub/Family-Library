    <script>
(function () {
    var problems = [];
    var bad = function (v) { return typeof v !== 'string' || v === '' || /^YOUR_/i.test(v); };
    if (typeof CLIENT_ID === 'undefined' && typeof API_KEY === 'undefined' && typeof ROOT_FOLDER_IDS === 'undefined') {
        problems.push('ไม่พบไฟล์ config.js (ต้องอยู่โฟลเดอร์เดียวกับ index.html)');
    } else {
        if (typeof CLIENT_ID === 'undefined' || bad(CLIENT_ID) || !/\.apps\.googleusercontent\.com$/.test(CLIENT_ID)) problems.push('CLIENT_ID ไม่ถูกต้อง');
        if (typeof API_KEY === 'undefined' || bad(API_KEY)) problems.push('API_KEY ยังไม่ได้ใส่');
        if (typeof ROOT_FOLDER_IDS === 'undefined' || !Array.isArray(ROOT_FOLDER_IDS) || !ROOT_FOLDER_IDS.length) problems.push("ROOT_FOLDER_IDS ไม่ถูกต้อง");
    }
    if (!problems.length) return;
    window.__CONFIG_PROBLEMS = problems;
    var show = function () {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#FFF8E6;color:#1B1B1B;font-family:Kanit,sans-serif;padding:32px;overflow:auto';
        d.innerHTML = '<h2>ตั้งค่าไฟล์ config.js ให้ครบก่อนใช้งาน</h2><ul>' + problems.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>';
        document.body ? document.body.appendChild(d) : document.addEventListener('DOMContentLoaded', function(){document.body.appendChild(d);});
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
    </script>

const normalizeSeriesKey = (name) => String(name || '').normalize('NFC').toLowerCase().replace(/[\s\-_]+/g, '').trim();
function parseVolumeName(fileName) {
    const lastDot = fileName.lastIndexOf('.');
    if (lastDot === -1) return null;
    const nameExt = fileName.substring(0, lastDot), ext = fileName.substring(lastDot + 1).toLowerCase();
    const rangeMatch = nameExt.match(/^(.+?)(?:\s+เล่ม\s*|\s*[_-]\s*|\s+)(\d+)\s*-\s*(\d+)$/i);
    if (rangeMatch) return { type: 'collection', seriesName: rangeMatch[1].trim(), volumeStart: parseInt(rangeMatch[2], 10), volumeEnd: parseInt(rangeMatch[3], 10), extension: ext };
    for (const pat of [/^(.+?)\s+เล่ม\s*(\d+)$/i, /^(.+?)_(\d+)$/, /^(.+?)-(\d+)$/, /^(.+?)\s+(\d+)$/]) {
        const m = nameExt.match(pat);
        if (m && m[1].trim()) return { type: 'single', seriesName: m[1].trim(), volumeNumber: parseInt(m[2], 10), extension: ext };
    }
    return null;
}
const isCoverImage = (name) => ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(name.split('.').pop().toLowerCase());
function groupFilesAndFolders(items) {
    let folders = [], individualFiles = [], coverFiles = [], parsedItems = [];
    items.forEach(item => {
        if (isFolderItem(item)) folders.push(item);
        else if (isCoverImage(item.name)) coverFiles.push(item);
        else {
            const parsed = parseVolumeName(item.name);
            parsed ? parsedItems.push({ item, parsed }) : individualFiles.push(item);
        }
    });
    const rangeKeys = new Set(parsedItems.filter(p => p.parsed.type === 'collection').map(p => normalizeSeriesKey(p.parsed.seriesName)));
    let seriesMap = {};
    parsedItems.forEach(({ item, parsed }) => {
        if (parsed.type === 'collection') {
            seriesMap[`${parsed.seriesName}_${item.id}`] = { type: 'collection', seriesName: parsed.seriesName, volumeRange: `เล่ม ${parsed.volumeStart}–${parsed.volumeEnd}`, books: [item], modifiedTime: item.modifiedTime };
        } else if (parsed.type === 'single') {
            const key = normalizeSeriesKey(parsed.seriesName);
            if (rangeKeys.has(key)) individualFiles.push({ ...item, isSingleWithRange: true, seriesName: parsed.seriesName, volumeNumber: parsed.volumeNumber });
            else {
                if (!seriesMap[key]) seriesMap[key] = { type: 'series', seriesName: parsed.seriesName, books: [], modifiedTime: item.modifiedTime };
                seriesMap[key].books.push({ ...item, volumeNumber: parsed.volumeNumber });
            }
        }
    });
    Object.values(seriesMap).forEach(s => { if (s.type === 'series') s.books.sort((a, b) => a.volumeNumber - b.volumeNumber); });
    return { folders, seriesList: Object.values(seriesMap), individualFiles, coverFiles };
}
const findSeriesCover = (seriesName, coverFiles) => {
    const target = normalizeSeriesKey(seriesName);
    const cover = coverFiles.find(c => normalizeSeriesKey(c.name.substring(0, c.name.lastIndexOf('.'))) === target);
    return cover?.thumbnailLink ? cover.thumbnailLink.split('=')[0] + '=s800' : null;
};

async function ensureSearchIndex() {

            r.onsuccess = () => { const t = r.result.transaction('kv').objectStore('kv').get('main'); t.onsuccess = () => res(t.result); };
        });

            searchIdx.entries.forEach(e => searchIdx.byId.set(e.id, e));

function openSeriesDetail(series) {
    currentViewMode = 'series-detail'; activeSeriesData = series;
    renderSeriesDetailUI(series);
}
function renderSeriesDetailUI(series) {
    const area = document.getElementById('content-area'); area.innerHTML = '';
    updateHeroStats(`ซีรีส์: ${escapeHtml(series.seriesName)} · ${series.books.length} เล่ม`);
    series.books.forEach(book => {
        let coverUrl = book.thumbnailLink ? book.thumbnailLink.split('=')[0] + '=s800' : null;
        let imgHTML = generatePremiumFallback('pdf', book.name) + (coverUrl ? `<img src="${coverUrl}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : '');
        area.appendChild(createCardElement('book-card', imgHTML, '', `เล่ม ${book.volumeNumber}`, () => openReader(book.id, book.name, book.mimeType), { id: book.id, name: book.name, kind: 'file', mime: book.mimeType }));
    });
}
function renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb'); if (!bc) return; bc.innerHTML = '';
    folderHistory.forEach((f, i) => {
        const isLast = i === folderHistory.length - 1;
        bc.innerHTML += `<span class="bc-item ${isLast?'current':''}" ${!isLast?`onclick="loadDriveContent('${f.id}','${f.name}')"`:''}>${i===0?'<i class="fas fa-home"></i> ':''}${escapeHtml(f.name)}</span>` + (!isLast ? '<span class="bc-separator"><i class="fas fa-chevron-right"></i></span>' : '');
    });
}
async function getFolderCover(folderId, folderName = '') {
    if (folderCoverCache.has(folderId)) return folderCoverCache.get(folderId);
    try {
        const res = await gapi.client.drive.files.list({ q: `'${folderId}' in parents and trashed = false and mimeType != 'application/vnd.google-apps.folder'`, fields: 'files(thumbnailLink)', pageSize: 1 });
        const url = res.result.files?.[0]?.thumbnailLink?.split('=')[0] + '=s800' || null;
        if (folderCoverCache.size >= MAX_CACHE_SIZE) {
            const firstKey = folderCoverCache.keys().next().value;
            folderCoverCache.delete(firstKey);
        }
        folderCoverCache.set(folderId, url);
        return url;
    } catch (e) { return null; }
}

const getBookmark = (id) => parseInt(localStorage.getItem(`familyComic:lastPage:${id}`)) || 1;
const saveBookmark = (id, p) => localStorage.setItem(`familyComic:lastPage:${id}`, p);
const showToast = (m) => { const t = document.getElementById('toast-message'); if(t){ t.innerHTML=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); } };

const RECENT_KEY = 'familyComic:recent_v1', FAV_KEY = 'familyComic:favorites_v1';
const getRecentReads = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e){ return []; } };
const recordRecentRead = (id, name, mime, page, total) => {
    let list = getRecentReads().filter(r => r.id !== id);
    list.unshift({ id, name, mime, page, total });
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
};
const resumeReading = (id) => { const r = getRecentReads().find(x => x.id === id); if (r) openReader(r.id, r.name, r.mime); };
const continueReadingHTML = () => {
    const list = getRecentReads().slice(0, 3);
    if (!list.length) return '';
    return `<div class="continue-section"><h2 class="continue-title">อ่านต่อ</h2><div class="continue-list">${list.map(r => `<div class="continue-card" onclick="resumeReading('${r.id}')"><div class="continue-thumb"><i class="fas fa-book-open"></i></div><div class="continue-info"><div class="continue-name">${escapeHtml(r.name)}</div><div class="continue-meta">หน้า ${r.page}/${r.total}</div></div></div>`).join('')}</div></div>`;
};
const getFavorites = () => { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e){ return []; } };
const isFavorite = (id) => getFavorites().some(f => f.id === id);
const toggleFavorite = (item) => {
    let list = getFavorites(), i = list.findIndex(f => f.id === item.id);
    if (i >= 0) list.splice(i, 1); else list.unshift(item);
    localStorage.setItem(FAV_KEY, JSON.stringify(list));
    return i < 0;
};
const attachFavButton = (card, item) => {
    const btn = document.createElement('button'); btn.className = 'fav-btn';
    const sync = () => { const on = isFavorite(item.id); btn.className = `fav-btn ${on?'on':''}`; btn.innerHTML = `<i class="${on?'fas':'far'} fa-heart"></i>`; };
    sync(); btn.onclick = (e) => { e.stopPropagation(); toggleFavorite(item); sync(); };
    card.appendChild(btn);
};
const favoritesHTML = () => {
    const list = getFavorites().slice(0, 6);
    if (!list.length) return '';
    return `<div class="continue-section"><div class="continue-head"><h2 class="continue-title">รายการโปรด</h2></div><div class="continue-list">${list.map(f => `<div class="continue-card" onclick="openReader('${f.id}','${f.name}','${f.mime}')"><div class="continue-thumb"><i class="fas fa-book"></i></div><div class="continue-info"><div class="continue-name">${escapeHtml(f.name)}</div></div></div>`).join('')}</div></div>`;
};

function openReader(fileId, fileName, mimeType) {
    currentFileId = fileId;
    document.getElementById('reader-title').innerText = fileName;
    document.getElementById('reader-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    const isPdf = mimeType?.includes('pdf');
    document.getElementById('pdf-canvas').style.display = isPdf ? 'block' : 'none';
    document.getElementById('pdf-toolbar').style.display = isPdf ? 'flex' : 'none';
    const frame = document.getElementById('reader-frame');
    frame.style.display = isPdf ? 'none' : 'block';
    if (!isPdf) frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
    else loadPDF();
}
async function loadPDF() {
    const loadId = ++readerLoadId, loadingUI = document.getElementById('pdf-loading');
    loadingUI.style.display = 'block'; loadingUI.innerHTML = 'กำลังโหลด...';
    canvas = document.getElementById('pdf-canvas'); ctx = canvas.getContext('2d');
    try {
        pdfDoc = await pdfjsLib.getDocument({ url: `https://www.googleapis.com/drive/v3/files/${currentFileId}?alt=media`, httpHeaders: { Authorization: `Bearer ${gapi.client.getToken().access_token}` } }).promise;
        if (loadId !== readerLoadId) return;
        document.getElementById('page_count').textContent = pdfDoc.numPages;
        loadingUI.style.display = 'none';
        pageNum = Math.min(getBookmark(currentFileId), pdfDoc.numPages);
        renderPage(pageNum);
    } catch (e) { if (loadId === readerLoadId) loadingUI.innerHTML = 'โหลดไม่สำเร็จ'; }
}
function renderPage(num) {
    pageRendering = true;
    pdfDoc.getPage(num).then(page => {
        const vp = page.getViewport({ scale: Math.min((document.querySelector('.reader-content').clientWidth - 8) / page.getViewport({scale:1}).width, 2) });
        canvas.width = vp.width; canvas.height = vp.height;
        page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => { pageRendering = false; });
    });
    document.getElementById('page_num').textContent = num;
    document.getElementById('btn-prev').disabled = num <= 1;
    document.getElementById('btn-next').disabled = num >= pdfDoc.numPages;
    saveBookmark(currentFileId, num);
    recordRecentRead(currentFileId, document.getElementById('reader-title').innerText, 'application/pdf', num, pdfDoc.numPages);
}
const onPrevPage = () => { if (pdfDoc && pageNum > 1) renderPage(--pageNum); };
const onNextPage = () => { if (pdfDoc && pageNum < pdfDoc.numPages) renderPage(++pageNum); };
function closeReader() {
    readerLoadId++; document.getElementById('reader-modal').style.display = 'none';
    document.getElementById('reader-frame').src = ''; document.body.style.overflow = 'auto';
    pdfDoc = null; if (activeCategoryFilter === 'dashboard') renderCategoryDashboard();
}
function toggleFullScreen() { if (!document.fullscreenElement) document.getElementById('reader-modal')?.requestFullscreen(); else document.exitFullscreen(); }
    </script>
</head>
<body>
    <header>
        <div class="logo-container" onclick="openCategoryDashboard()">
            <div class="logo-icon-wrapper"><i class="fas fa-book-open"></i></div>
            <div class="logo-text"><h1 class="logo">บ้านการ์ตูนของเรา</h1><p class="logo-sub">FAMILY LIBRARY V7.9.4</p></div>
        </div>
        <div class="controls">
            <div id="status-badge" class="status-badge status-loading"><i class="fas fa-spinner fa-spin"></i> <span>กำลังเตรียม...</span></div>
            <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
            <button id="loginBtn" class="btn-auth" onclick="handleAuthClick()"><i class="fab fa-google"></i> เข้าสู่ระบบ</button>
            <button id="logoutBtn" class="btn-auth btn-logout" onclick="handleSignoutClick()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>
    <div class="main-container">
        <div class="library-hero"><h1>ห้องสมุดของเรา</h1><p>รวมการ์ตูนและหนังสือไว้ในที่เดียว</p><div class="hero-stats" id="hero-stats">กำลังโหลด...</div></div>
        <div class="library-nav"><div id="breadcrumb"></div></div>
        <div class="library-toolbar">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="ค้นหา..."></div>
            <div class="scope-toggle" id="scope-toggle" style="display:none"><button type="button" id="scope-local" aria-pressed="true" onclick="setSearchScope('local')">ในแฟ้ม</button><button type="button" id="scope-global" aria-pressed="false" onclick="setSearchScope('global')">ทั้งหมด</button></div>
            <div class="sort-box"><select id="sortSelect"><option value="default">จัดตามชื่อ</option><option value="latest">ล่าสุด</option></select></div>
        </div>
        <div id="content-area" class="bookshelf-grid"></div>
    </div>
    <button id="backToTopBtn" onclick="scrollToTop()" title="กลับขึ้นด้านบน"><i class="fas fa-chevron-up"></i></button>
    <div id="category-modal-overlay" class="custom-modal-overlay">
        <div class="custom-modal">
            <div class="modal-header"><h3 id="category-modal-title">หมวดหมู่</h3><button class="modal-close-btn" onclick="closeCategoryModal()"><i class="fas fa-times"></i></button></div>
            <div class="modal-body">
                <div class="form-group"><label>ชื่อหมวดหมู่</label><input type="text" id="cat-name-input"></div>
                <div class="form-group"><label>สี</label><div id="color-picker-container" class="color-picker-grid"></div></div>
                <div class="form-group"><label>ไอคอน</label><div id="icon-picker-container" class="icon-picker-grid"></div></div>
            </div>
            <div class="modal-footer"><button class="btn-modal btn-modal-cancel" onclick="closeCategoryModal()">ยกเลิก</button><button class="btn-modal btn-modal-submit" onclick="handleCategoryFormSubmit()">บันทึก</button></div>
        </div>
    </div>
    <div id="reader-modal" class="reader-modal">
        <div id="toast-message"></div>
        <div id="immersive-page" class="immersive-page"></div>
        <div class="reader-header">
            <button class="btn-reader btn-back" onclick="closeReader()"><i class="fas fa-arrow-left"></i> <span class="btn-text">ปิด</span></button>
            <span id="reader-title" class="reader-title">กำลังโหลด...</span>
            <button class="btn-reader" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></button>
        </div>
        <div class="reader-content">
            <div id="pdf-loading"></div>
            <div class="tap-zone left" onclick="onPrevPage()"></div><div class="tap-zone right" onclick="onNextPage()"></div>
            <canvas id="pdf-canvas"></canvas>
            <iframe id="reader-frame" class="reader-frame" frameborder="0"></iframe>
        </div>
        <div class="pdf-toolbar" id="pdf-toolbar" style="display:none;">
            <button id="btn-prev" onclick="onPrevPage()"><i class="fas fa-chevron-left"></i></button>
            <span class="page-info"><span id="page_num"></span> / <span id="page_count"></span></span>
            <button id="btn-next" onclick="onNextPage()"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</body>
