.premium-fallback::before { content: ''; position: absolute; left: 0; top: 0; width: 8%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0.25), rgba(0,0,0,0.12)); border-right: 1px solid rgba(0,0,0,0.1); z-index: 2 }

.fallback-content .f-title { font-size: 0.9rem; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 4px rgba(0,0,0,0.25) }
.bg-pdf { background: linear-gradient(135deg, var(--cover-pdf-a), var(--cover-pdf-b)) }
.bg-series { background: linear-gradient(135deg, var(--cover-series-a), var(--cover-series-b)) }
.bg-empty { background: linear-gradient(135deg, var(--cover-empty-a), var(--cover-empty-b)) }
.bg-folder { background: linear-gradient(135deg, var(--surface-hover), var(--surface-sunken)) }
.bg-folder .fallback-content { color: var(--text-soft); padding: 16px }

.bg-folder::before { display: none }
.skeleton-book { display: flex; flex-direction: column; gap: 12px; animation: pulse 1.5s infinite ease-in-out }
.sk-cover { width: 100%; aspect-ratio: 3/4; background: var(--surface-sunken); border-radius: var(--radius-lg) }
.sk-text { height: 14px; background: var(--surface-sunken); border-radius: 6px; width: 90% }
@keyframes pulse { 0% { opacity: 0.5 } 50% { opacity: 1 } 100% { opacity: 0.5 } }
.state-container { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: var(--surface); border-radius: var(--radius-xl); border: 2px dashed var(--border-strong); box-shadow: var(--shadow-card); display: flex; flex-direction: column; align-items: center; justify-content: center }
.state-icon { font-size: 4rem; margin-bottom: 20px }
.state-title { font-size: 1.35rem; color: var(--text-main); font-weight: 700; margin-bottom: 8px }
.state-desc { font-size: 1rem; color: var(--text-muted); max-width: 400px; line-height: 1.6 }
.state-error { border-color: var(--danger-border); background: var(--danger-bg) }
.reader-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; max-height: 100dvh; background: var(--reader-bg); z-index: 9999; flex-direction: column; overflow: hidden }
.reader-header { background: var(--reader-surface); color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100 }
.reader-title { font-weight: 600; flex-grow: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 15px; font-size: 1.15rem }
.btn-reader { background: var(--reader-surface-2); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; font-family: 'Kanit', sans-serif }
.btn-reader:hover { background: var(--reader-surface-3) }
.btn-back { background: var(--danger-solid) }
.btn-back:hover { background: var(--danger) }
.reader-content { flex-grow: 1; display: flex; justify-content: center; overflow: auto; position: relative; background: var(--reader-black); min-height: 0 }
#pdf-canvas { display: block; margin: 0 auto; box-shadow: 0 0 25px rgba(0,0,0,0.8); max-width: 100% }
.reader-frame { width: 100%; height: 100%; border: none; background: white; display: none }
#toast-message { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.95); color: white; padding: 12px 25px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; z-index: 10000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(4px) }
.tap-zone { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 50; cursor: pointer }
.tap-zone.left { left: 0 }
.tap-zone.right { right: 0 }
.pdf-toolbar { background: var(--reader-surface); color: white; padding: 14px 24px; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.5) }
.pdf-toolbar button { background: var(--primary); padding: 10px 22px; border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; font-size: 1.05rem; display: flex; align-items: center; gap: 8px }
.pdf-toolbar button:hover { background: var(--primary-hover) }
.pdf-toolbar button:disabled { background: var(--reader-surface-3); cursor: not-allowed; color: var(--reader-muted) }
.page-info { font-size: 1.05rem; font-weight: 600; background: var(--reader-surface-2); padding: 8px 18px; border-radius: 10px; color: white }
#pdf-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.2rem; display: none; text-align: center; z-index: 90; background: rgba(0,0,0,0.85); padding: 30px 50px; border-radius: 16px; backdrop-filter: blur(8px) }
.mobile-nav-overlay { position: fixed; pointer-events: none; z-index: 20000 }
/* ===== V7.3.3 Re-skin (แนว D: ครีม + หมึกดำ + สีสดเฉพาะจุด) ปรับเฉพาะสี/เส้น/เงา/ขนาดตัวอักษร ไม่แตะ layout หลักและ logic ===== */
header { background: var(--header-bg); box-shadow: none }
.logo-icon-wrapper { background: var(--pink); color: var(--ink); box-shadow: none; border-radius: 50% }
.logo { background: none; -webkit-background-clip: border-box; background-clip: border-box; -webkit-text-fill-color: var(--ink); color: var(--ink); font-weight: 600 }
button.btn-auth { background: var(--ink); box-shadow: none }
button.btn-auth:hover { background: var(--ink-hover); box-shadow: none; transform: translateY(-1px) }
button.btn-logout { background: transparent; border: 1.5px solid var(--ink); color: var(--ink) }
button.btn-logout:hover { background: var(--surface); color: var(--danger) }
.library-hero { background: none; border: none; box-shadow: none; border-radius: 0; padding: 2.5rem 0 0.5rem; margin: 0; text-align: left; overflow: visible }

.hero-stats { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; box-shadow: none; border: none; color: var(--text-muted); font-weight: 500 }
.btn-manage-cats { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); box-shadow: none }
.btn-manage-cats:hover { background: var(--surface); border-color: var(--ink) }
.category-card { border: 1.5px solid var(--border); box-shadow: none }
.category-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--ink) }
.cat-icon-box { border-radius: 50%; box-shadow: none }
.cat-card-footer { color: var(--ink) }
.btn-add-cat { background: var(--ink); box-shadow: none }
.btn-add-cat:hover { background: var(--ink-hover); box-shadow: none }
.btn-modal-submit { background: var(--ink); box-shadow: none }
.btn-modal-submit:hover { background: var(--ink-hover) }
.icon-option.selected { background: var(--ink); border-color: var(--ink) }
.search-box input { border: 1.5px solid var(--ink); box-shadow: none }
.search-box input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px var(--yellow) }
.sort-box { border: 1.5px solid var(--ink); box-shadow: none }
.bc-item { box-shadow: none }
.bc-item.current { background: var(--ink); border-color: var(--ink); box-shadow: none }
.folder-card .book-card-cover { border: 2px solid var(--folder-b); background: linear-gradient(135deg, var(--folder-a), var(--folder-b)) }
.folder-card:hover .book-card-cover { border-color: var(--ink) }
.bg-folder { background: linear-gradient(135deg, var(--folder-a), var(--folder-b)) }
.bg-folder .fallback-content i { color: var(--ink) }
.bg-folder .f-title { text-shadow: none }
.badge-series { background: var(--primary-hover) }
.state-container { border: 2px dashed var(--border-strong); box-shadow: none }
@media (max-width: 639px) { .library-hero { padding-top: 1.5rem } .library-hero h1 { font-size: 2.25rem } }
/* ===== V7.4 Dashboard/Home: การ์ดหมวดหมู่แบบ bento (บล็อกสีจากสีหมวด + ตัวเลขใหญ่) ===== */
.category-dashboard-grid, .dashboard-action-bar, .cat-manage-container { grid-column: 1 / -1 }
.category-dashboard-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; grid-auto-flow: dense; margin-bottom: 32px }
.category-card { min-height: 152px; padding: 24px; gap: 12px; background: var(--surface); color: var(--ink) }
@supports (background: color-mix(in srgb, red 50%, white)) { .category-card { background: color-mix(in srgb, var(--cat, var(--surface)) 40%, var(--bg-color)) } }
.category-card:first-child { grid-column: span 2; grid-row: span 2; min-height: 320px }
.category-card:last-child:not(:first-child) { grid-column: span 2; background: transparent; border: 1.5px dashed var(--border-strong) }
.category-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.category-card .cat-card-header { margin-bottom: 0 }
.category-card .cat-info h3 { font-size: 1.35rem; font-weight: 600; color: var(--ink) }
.category-card .cat-count { margin-top: auto; font-size: 1rem; font-weight: 500; color: var(--ink) }
.cat-num { display: block; font-size: 3.75rem; line-height: 1; font-weight: 300; letter-spacing: -2px }

.category-card .cat-card-footer { border-top: none; padding-top: 0; margin-top: 0 }

/* ===== V7.5 อ่านต่อจากหน้าล่าสุด ===== */
.continue-section { grid-column: 1 / -1; margin-bottom: 24px }
.continue-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; color: var(--ink) }
.continue-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
.continue-card { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 52px 12px 12px; cursor: pointer; transition: border-color 0.2s, transform 0.2s }
.continue-card:hover { border-color: var(--ink); transform: translateY(-2px) }
.continue-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.continue-thumb { flex: 0 0 48px; height: 68px; border-radius: 6px 10px 10px 6px; background: linear-gradient(135deg, var(--cover-pdf-a), var(--cover-pdf-b)); display: flex; align-items: center; justify-content: center; color: var(--on-dark); font-size: 1.2rem }
.continue-info { min-width: 0; flex: 1 }
.continue-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink) }
.continue-meta { font-size: 0.85rem; color: var(--text-muted) }
.continue-bar { height: 6px; border-radius: 99px; background: var(--surface-sunken); margin-top: 8px; overflow: hidden }
.continue-bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px }
.continue-remove { position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: none; background: transparent; color: var(--text-muted); border-radius: 50%; cursor: pointer; font-size: 0.95rem }
.continue-remove:hover { color: var(--danger) }
/* ===== V7.6 รายการโปรด ===== */
.book-card .fav-btn { position: absolute; top: 8px; left: 8px; z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--surface); color: var(--text-muted); box-shadow: var(--shadow-card); cursor: pointer; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; transition: transform 0.15s }
.book-card .fav-btn:hover { transform: scale(1.08) }
.book-card .fav-btn.on { color: var(--danger) }
.book-card .fav-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px }
.continue-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px }
.continue-head .continue-title { margin: 0 }
.fav-more { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 99px; padding: 0 16px; min-height: 36px; font-family: 'Kanit', sans-serif; font-weight: 500; cursor: pointer }
.continue-thumb.is-folder { background: linear-gradient(135deg, var(--folder-a), var(--folder-b)); color: var(--ink) }
.continue-remove.is-fav { color: var(--danger) }
/* ===== V7.6.3 แจ้งสิทธิ์ + แผงแชร์หมวดหมู่ ===== */
.access-notice { grid-column: 1 / -1; background: var(--warn-bg); border: 1.5px solid var(--warn-border); color: var(--ink); border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 16px; font-size: 0.95rem }
.sync-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px }
.sync-title { font-weight: 600; margin-bottom: 8px }
.sync-status { border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; margin-bottom: 10px }
.sync-status.ok { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--ink) }
.sync-status.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--ink) }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px }
.sync-help { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted) }
/* ===== V7.7 Global Search ===== */
.scope-toggle { display: flex; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 99px; padding: 4px; gap: 2px }
.scope-toggle button { font-family: 'Kanit', sans-serif; font-size: 0.9rem; font-weight: 500; border: none; background: transparent; color: var(--ink); border-radius: 99px; padding: 8px 14px; min-height: 36px; cursor: pointer }
.scope-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--on-dark) }
.search-results { grid-column: 1 / -1 }
.search-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted) }
.search-list { display: grid; gap: 8px }
.search-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 10px 14px; cursor: pointer; min-height: 56px }
.search-row:hover { border-color: var(--ink) }
.search-row:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px }
.search-ico { flex: 0 0 36px; height: 44px; border-radius: 6px 10px 10px 6px; background: linear-gradient(135deg, var(--cover-pdf-a), var(--cover-pdf-b)); color: var(--on-dark); display: flex; align-items: center; justify-content: center }
.search-ico.is-folder { background: linear-gradient(135deg, var(--folder-a), var(--folder-b)); color: var(--ink) }
.search-info { min-width: 0; flex: 1 }
.search-name { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.search-name mark { background: var(--yellow); color: var(--on-bright); border-radius: 3px; padding: 0 2px }
.search-path { font-size: 0.82rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.search-tag { flex: 0 0 auto; font-size: 0.78rem; color: var(--text-muted); border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px }
@media (max-width: 639px) { header { padding-left: 14px; padding-right: 14px }
.main-container { padding-left: 14px; padding-right: 14px }

.search-box { min-width: 0; width: 100% }
.sort-box { width: 100% }

.bookshelf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.category-dashboard-grid { grid-template-columns: 1fr }
.cat-list-item { flex-direction: column; align-items: flex-start; gap: 12px }
.cat-item-actions { width: 100%; justify-content: flex-end }

.mobile-nav-btn { pointer-events: auto !important; width: 54px !important; height: 54px !important; border-radius: 50% !important; background: rgba(0,0,0,0.75) !important; color: var(--on-dark) !important; display: flex !important; align-items: center !important; justify-content: center !important; border: 1px solid rgba(255,255,255,0.4) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important }
.btn-text { display: none }
}
@media (max-width: 639px) { .logo-sub { display: none } .status-badge { white-space: nowrap; padding-left: 12px; padding-right: 12px } }

/* ===== V7.8 Mobile UI: safe-area, เป้าสัมผัส 44px, โหมดอ่านเต็มจอ ===== */
header { padding-top: calc(0.75rem + var(--safe-top)); padding-left: max(2rem, var(--safe-left)); padding-right: max(2rem, var(--safe-right)) }
.main-container { padding-left: max(24px, var(--safe-left)); padding-right: max(24px, var(--safe-right)); margin-bottom: calc(80px + var(--safe-bottom)) }
.reader-header { padding-top: calc(12px + var(--safe-top)); padding-left: max(24px, var(--safe-left)); padding-right: max(24px, var(--safe-right)) }
.pdf-toolbar { padding-bottom: calc(14px + var(--safe-bottom)); padding-left: max(24px, var(--safe-left)); padding-right: max(24px, var(--safe-right)) }
.reader-modal, .reader-content { overscroll-behavior: contain }
.immersive-page { display: none; position: absolute; bottom: calc(14px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.82); border: 1px solid rgba(255, 255, 255, 0.35); color: var(--on-dark); padding: 6px 18px; border-radius: 99px; font-size: 1rem; font-weight: 600; z-index: 60; pointer-events: none }

@media (max-width: 768px) {

}
@media (max-width: 639px) {
header { padding-left: max(14px, var(--safe-left)); padding-right: max(14px, var(--safe-right)) }
.main-container { padding-left: max(14px, var(--safe-left)); padding-right: max(14px, var(--safe-right)) }
.reader-header, .pdf-toolbar { padding-left: max(14px, var(--safe-left)); padding-right: max(14px, var(--safe-right)) }

}

/* ===== V7.9 Dark Mode: ธีมมืดผ่านโทเค็น (ตั้ง data-theme ที่ <html> จาก JS: อัตโนมัติ/สว่าง/มืด) ===== */
:root[data-theme="light"] { color-scheme: light }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-color: #14120F; --surface: #1F1C17; --surface-alt: #26221C; --surface-hover: #2D2922; --surface-sunken: #38332B; --surface-sunken-hover: #433D33;
  --border: #3A352C; --border-strong: #5C5546;
  --text-main: #F3EEE3; --text-muted: #B8AF9E; --text-soft: #D1C9B8; --text-faint: #968D7C;
  --ink: #F3EEE3; --ink-hover: #FFFFFF; --on-ink: #14120F; --primary-text: #A5A8FF;
  --primary-light: #26264A; --primary-border: #45459A; --primary-border-soft: #34346F;
  --danger: #F87171; --danger-bg: #3A1618; --danger-border: #6E2A2E;
  --warn: #FBBF24; --warn-bg: #36290C; --warn-border: #6A5316;
  --success: #34D399; --success-bg: #0F2D26; --success-border: #1F5C4C;
  --folder-a: #3A3223; --folder-b: #4A3F27;
  --hero-a: #1A1A33; --hero-b: #2A1A26; --hero-c: #2E2711;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px -6px rgba(0, 0, 0, 0.5); --shadow-hover: 0 14px 28px -10px rgba(0, 0, 0, 0.65);
  --header-bg: rgba(20, 18, 15, 0.88); --overlay-bg: rgba(0, 0, 0, 0.7); --cover-edge: rgba(255, 255, 255, 0.08); --mapbar-bg: rgba(255, 255, 255, 0.04);
}

        if (readerIsOpenPdf() && c && Math.abs(c.clientWidth - lastRenderWidth) > 24) queueRenderPage(pageNum);
    }, 200);
});
async function acquireWakeLock() {
    try {
        if (!isMobileView() || !('wakeLock' in navigator) || wakeLock) return;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
}
function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && readerIsOpenPdf()) acquireWakeLock(); });
function maybeShowReaderHint() {
    try {
        if (!isMobileView() || localStorage.getItem('familyComic:readerHint_v1')) return;
        localStorage.setItem('familyComic:readerHint_v1', '1');
        setTimeout(() => showToast('ปัดเพื่อพลิกหน้า · แตะกลางซ่อนแถบ'), 700);
    } catch (e) {}
}
document.addEventListener('DOMContentLoaded', applyTheme);
function closeReader() {
    releaseWakeLock(); document.getElementById('reader-modal').classList.remove('reader-immersive');
    readerLoadId++;
    document.getElementById('reader-modal').style.display = 'none';
    document.getElementById('reader-frame').src = '';
    document.body.style.overflow = 'auto';
    if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (document.fullscreenElement) document.exitFullscreen();
    currentFileId = null; pageRendering = false; pageNumPending = null; pdfDoc = null;
    currentReaderMeta = null;
    if (readerFromSearch) { readerFromSearch = false; if (isGlobalSearch() && document.getElementById('searchInput').value.trim()) onSearchInput(true); else if (currentFolderItems.length > 0) applySearchAndSort(); }
    else if (readerFromHome) { readerFromHome = false; if (activeCategoryFilter === 'dashboard' && rootFolderSubItems.length > 0) renderCategoryDashboard(); }
    else if (currentFolderItems.length > 0) applySearchAndSort();
}
function toggleFullScreen() { if (!document.fullscreenElement) document.getElementById('reader-modal')?.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
</script>
</head>
<body>
    <header>
        <div class="logo-container" onclick="openCategoryDashboard()">
            <div class="logo-icon-wrapper"><i class="fas fa-book-open"></i></div>
            <div class="logo-text">
                <h1 class="logo">บ้านการ์ตูนของเรา</h1>
                <p class="logo-sub">FAMILY LIBRARY V7.9 Dark Mode</p>
            </div>
        </div>
        <div class="controls">
            <div id="status-badge" class="status-badge status-loading"><i class="fas fa-spinner fa-spin"></i> <span>กำลังเตรียมข้อมูล...</span></div>
            <button id="loginBtn" class="btn-auth" onclick="handleAuthClick()" aria-label="เข้าสู่ระบบ" title="เข้าสู่ระบบ"><i class="fab fa-google"></i> เข้าสู่ระบบ</button>
            <button id="logoutBtn" class="btn-auth btn-logout" onclick="handleSignoutClick()"><i class="fas fa-sign-out-alt"></i></button>
            <button id="themeBtn" class="btn-theme" type="button" onclick="cycleTheme()" aria-label="ธีม: อัตโนมัติ" title="ธีม: อัตโนมัติ"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>
    <div class="main-container">
        <div class="library-hero">
            <h1>ห้องสมุดของเรา</h1>
            <p>รวมการ์ตูน หนังสือ และเรื่องโปรดของเราไว้ในที่เดียว</p>
            <div class="hero-stats" id="hero-stats"><i class="fas fa-spinner fa-spin" style="margin-right: 6px;"></i> กำลังโหลด...</div>
        </div>
        <div class="library-nav"><div id="breadcrumb"></div></div>
        <div class="library-toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาหนังสือ, แฟ้ม, หรือซีรีส์...">
            </div>
            <div class="scope-toggle" id="scope-toggle" role="group" aria-label="ขอบเขตการค้นหา" style="display:none">
                <button type="button" id="scope-local" aria-pressed="true" onclick="setSearchScope('local')">ในแฟ้มนี้</button>
                <button type="button" id="scope-global" aria-pressed="false" onclick="setSearchScope('global')">ทั้งห้องสมุด</button>
            </div>
            <div class="sort-box">
                <select id="sortSelect">
                    <option value="default">จัดตามชื่อ (ก-ฮ)</option>
                    <option value="latest">เพิ่มล่าสุด (ใหม่ไปเก่า)</option>
                    <option value="name-asc">ชื่อ (A-Z)</option>
                    <option value="name-desc">ชื่อ (Z-A)</option>
                </select>
            </div>
        </div>
        <div id="content-area" class="bookshelf-grid"></div>
    </div>
    <div id="category-modal-overlay" class="custom-modal-overlay">
        <div class="custom-modal">
            <div class="modal-header">
                <h3 id="category-modal-title">เพิ่มหมวดหมู่ใหม่</h3>
                <button class="modal-close-btn" onclick="closeCategoryModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="cat-name-input">ชื่อหมวดหมู่</label>
                    <input type="text" id="cat-name-input" placeholder="เช่น มังงะ, นิตยสาร...">
                </div>
                <div class="form-group">
                    <label>เลือกสีหมวดหมู่</label>
                    <div id="color-picker-container" class="color-picker-grid"></div>
                </div>
                <div class="form-group">
                    <label>เลือกไอคอน</label>
                    <div id="icon-picker-container" class="icon-picker-grid"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-modal-cancel" onclick="closeCategoryModal()">ยกเลิก</button>
                <button class="btn-modal btn-modal-submit" onclick="handleCategoryFormSubmit()"><span id="category-modal-submit-text">สร้างหมวดหมู่</span></button>
            </div>
        </div>
    </div>
    <div id="reader-modal" class="reader-modal">
        <div id="toast-message"></div>
        <div id="immersive-page" class="immersive-page"></div>
        <div class="reader-header">
            <button class="btn-reader btn-back" onclick="closeReader()"><i class="fas fa-arrow-left"></i> <span class="btn-text">ปิดหนังสือ</span></button>
            <span id="reader-title" class="reader-title">กำลังโหลด...</span>
            <button class="btn-reader" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> <span class="btn-text">เต็มจอ</span></button>
        </div>
        <div class="reader-content">
            <div id="pdf-loading"></div>
            <div id="tap-zone-left" class="tap-zone left" onclick="onPrevPage()" style="display: none;"></div>
            <div id="tap-zone-right" class="tap-zone right" onclick="onNextPage()" style="display: none;"></div>
            <canvas id="pdf-canvas"></canvas>
            <iframe id="reader-frame" class="reader-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="mobile-nav-overlay">
            <button id="mobile-btn-prev" class="mobile-nav-btn" onclick="onPrevPage()"><i class="fas fa-chevron-left"></i></button>
            <button id="mobile-btn-next" class="mobile-nav-btn" onclick="onNextPage()"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div id="pdf-toolbar" class="pdf-toolbar" style="display: none;">
            <button id="btn-prev" onclick="onPrevPage()"><i class="fas fa-chevron-left"></i> <span class="btn-text">ย้อนกลับ</span></button>
            <span class="page-info">หน้า <span id="page_num"></span> / <span id="page_count"></span></span>
            <button id="btn-next" onclick="onNextPage()"><span class="btn-text">ถัดไป</span> <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</body>
</html>
